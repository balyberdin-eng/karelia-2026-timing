<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Karhun jäljillä · Тайминг поездки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f3;
    --ink: #1a1a17;
    --muted: #7a756c;
    --line: #e7e1d4;
    --accent: #b5551f;
    --accent-soft: #f0e3d3;
    --card: #ffffff;
    --overlay: rgba(15, 14, 10, 0.55);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; font-weight: 600; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  svg.icon { width: 100%; height: 100%; display: block; }

  /* ── Hero ─────────────────────────────────────────────────────── */

  header.hero {
    position: relative;
    min-height: 92vh;
    display: flex;
    align-items: flex-end;
    background: linear-gradient(var(--overlay), var(--overlay)), url("photos/ruskeala.jpg") center 65% / cover no-repeat;
    color: #fff;
  }
  header.hero .inner { padding: 64px 24px 56px; width: 100%; max-width: 1080px; margin: 0 auto; }
  header.hero .eyebrow {
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #f0d9be;
    font-weight: 600;
    margin: 0 0 18px;
  }
  header.hero h1 {
    font-size: clamp(44px, 8vw, 92px);
    line-height: 0.98;
    margin: 0 0 20px;
    letter-spacing: -0.01em;
  }
  header.hero p { margin: 0; font-size: 16px; opacity: 0.92; max-width: 560px; }
  header.hero .hero-subtitle { margin-bottom: 10px; }
  header.hero .hero-tagline { max-width: 560px; margin-bottom: 14px; opacity: 0.95; }
  header.hero .motto { font-style: italic; color: #f0d9be; margin-top: 18px; }
  header.hero .disclaimer {
    margin-top: 18px;
    font-size: 13px;
    opacity: 0.85;
    max-width: 520px;
    border-left: 2px solid #f0d9be;
    padding-left: 14px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 26px;
    padding: 9px 20px;
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    font-weight: 600;
    font-size: 13px;
  }
  .status-badge.live { background: var(--accent); color: #fff; }
  .status-badge.live .pulse {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .status-badge.done { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.4); }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  .trip-progress { display: flex; gap: 5px; max-width: 340px; margin-top: 22px; }
  .trip-progress .seg { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.3); overflow: hidden; }
  .trip-progress .seg > i { display: block; height: 100%; width: 0%; background: #fff; }
  .trip-progress .seg.today > i { background: var(--accent); }

  /* ── Day nav ──────────────────────────────────────────────────── */

  nav.days {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(250, 248, 243, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
  }
  nav.days .row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  nav.days .row::-webkit-scrollbar { display: none; }
  nav.days a {
    flex-shrink: 0;
    text-decoration: none;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s ease;
    white-space: nowrap;
    position: relative;
  }
  nav.days a.active, nav.days a:hover { background: var(--ink); border-color: var(--ink); color: #fff; }
  nav.days a.today::after {
    content: ""; position: absolute; top: -2px; right: -2px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); border: 2px solid var(--bg);
  }

  /* ── Day spreads (full-bleed photo backdrop) ─────────────────────── */

  main { padding: 0; }

  section.day-spread {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
    color: #fff;
    scroll-margin-top: 56px;
  }
  section.day-spread .bg { position: absolute; inset: 0; z-index: 0; }
  section.day-spread .bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  section.day-spread .scrim {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(12,11,8,0.35), rgba(12,11,8,0.68));
  }
  section.day-spread .wrap { position: relative; z-index: 2; width: 100%; padding-top: 60px; padding-bottom: 60px; }
  section.day-spread .num {
    position: absolute; top: 28px; right: 28px; z-index: 3;
    font-family: "Fraunces", serif; font-size: 14px; font-weight: 600;
    background: rgba(0,0,0,0.35); backdrop-filter: blur(4px);
    padding: 6px 14px; border-radius: 999px;
  }
  section.day-spread .num.today { background: var(--accent); }
  section.day-spread .credit {
    position: absolute; bottom: 18px; right: 24px; z-index: 3;
    font-size: 11.5px; color: rgba(255,255,255,0.7);
  }

  section.day-spread:nth-of-type(even) .day-panel { margin-left: auto; }

  .day-panel {
    max-width: 540px;
    max-height: min(64vh, 620px);
    display: flex;
    flex-direction: column;
    background: rgba(16, 14, 10, 0.4);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 30px 32px;
  }
  .day-panel .kicker { color: #f0d9be; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 8px; flex-shrink: 0; }
  .day-panel h2 { font-size: clamp(24px, 2.8vw, 34px); margin: 0 0 6px; flex-shrink: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.5); }
  .day-panel .date { color: rgba(255,255,255,0.75); font-size: 14px; margin-bottom: 18px; flex-shrink: 0; }
  .day-panel.today h2::after {
    content: "СЕЙЧАС"; margin-left: 12px; font-family: "Inter", sans-serif;
    font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--accent);
    vertical-align: middle;
  }

  .t-list {
    overflow-y: auto;
    padding-right: 10px;
    margin-right: -10px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.35) transparent;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    mask-image: linear-gradient(180deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  .t-list::-webkit-scrollbar { width: 6px; }
  .t-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

  .t-item {
    display: grid;
    grid-template-columns: 92px 1fr;
    gap: 18px;
    padding: 15px 0;
    border-top: 1px solid rgba(255,255,255,0.16);
  }
  .t-item:last-child { border-bottom: 1px solid rgba(255,255,255,0.16); }
  .t-item.past { opacity: 0.5; }
  .t-item.now { background: var(--accent); margin: 0 -16px; padding: 15px 16px; border-radius: 10px; border-top-color: transparent; }
  .t-item .time { font-size: 12.5px; font-weight: 700; color: #f0d9be; letter-spacing: 0.03em; padding-top: 2px; }
  .t-item.now .time { color: #fff; }
  .t-item .body .title { font-weight: 600; font-size: 15px; margin-bottom: 3px; }
  .t-item .body .meta { font-size: 13px; color: rgba(255,255,255,0.78); font-style: italic; line-height: 1.5; }

  @media (max-width: 860px) {
    section.day-spread { min-height: auto; padding: 100px 0 60px; align-items: flex-end; }
    .day-panel { max-width: none; padding: 28px 24px; }
    .t-item { grid-template-columns: 72px 1fr; }
  }

  /* ── Extra sections ───────────────────────────────────────────── */

  section.extra { padding: 70px 0; border-top: 1px solid var(--line); }
  section.extra .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  section.extra .section-head svg.icon { width: 22px; height: 22px; color: var(--accent); }
  section.extra h2 { font-size: 26px; margin: 0; }
  section.extra > .note { color: var(--muted); font-size: 14px; margin: 0 0 28px; max-width: 560px; }

  .house-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
  .house-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .house-card .photo { height: 170px; overflow: hidden; }
  .house-card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .house-card .body { padding: 20px 22px; }
  .house-card h3 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
  .house-card .people { font-size: 13.5px; color: var(--ink); margin-bottom: 8px; }
  .house-card .note { font-size: 13.5px; color: var(--muted); margin: 0; font-style: italic; }

  .ornament-strip {
    width: 100%;
    height: 56px;
    background-image: url("photos/ornament-birds.jpg");
    background-repeat: repeat-x;
    background-size: auto 100%;
    background-position: center;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  .glossary-spread {
    position: relative;
    overflow: hidden;
    color: #fff;
    padding: 90px 0;
  }
  .glossary-spread .bg { position: absolute; inset: 0; z-index: 0; }
  .glossary-spread .bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .glossary-spread .scrim { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(10,14,6,0.55), rgba(10,14,6,0.75)); }
  .glossary-spread .wrap { position: relative; z-index: 2; }
  .glossary-panel {
    max-width: 640px;
    margin: 0 auto;
    background: rgba(14, 16, 8, 0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 16px;
    padding: 40px;
  }
  .glossary-panel .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .glossary-panel .section-head svg.icon { width: 22px; height: 22px; flex-shrink: 0; color: #f0d9be; }
  .glossary-panel h2 { color: #fff; }
  .glossary-panel > .note { color: rgba(255,255,255,0.75); }

  .glossary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .glossary-grid .term-row { padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.18); }
  .glossary-grid .term { display: block; font-family: "Fraunces", serif; font-weight: 600; color: #f0d9be; font-size: 17px; margin-bottom: 4px; }
  .glossary-grid .def { font-size: 13.5px; color: rgba(255,255,255,0.78); }

  .ornament-footer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    height: 40px;
    background-image: url("photos/ornament-birds.jpg");
    background-repeat: repeat-x;
    background-size: auto 100%;
    background-position: center;
  }
  @media (max-width: 480px) {
    .ornament-footer { height: 28px; }
  }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 40px 0; }
</style>
</head>
<body>

<header class="hero">
  <div class="inner">
    <p class="eyebrow" id="hero-place"></p>
    <h1 id="hero-title"></h1>
    <p class="hero-subtitle" id="hero-subtitle"></p>
    <p class="hero-tagline" id="hero-tagline"></p>
    <p id="hero-dates"></p>
    <p class="motto" id="hero-motto"></p>
    <div id="status-root"></div>
    <div class="trip-progress" id="trip-progress"></div>
    <p class="disclaimer" id="hero-disclaimer"></p>
  </div>
  <div class="ornament-footer"></div>
</header>

<nav class="days">
  <div class="wrap row" id="day-nav"></div>
</nav>

<main id="days-root"></main>

<div class="ornament-strip"></div>

<section class="wrap extra" id="lodging-root"></section>

<div class="ornament-strip"></div>

<section class="glossary-spread">
  <div class="bg"><img src="photos/berries-macro.jpg" alt="Карельские ягоды" loading="lazy"></div>
  <div class="scrim"></div>
  <div class="wrap"><div class="glossary-panel" id="glossary-root"></div></div>
  <div class="ornament-footer"></div>
</section>

<footer>Составлено вручную · заменить данные на свой маршрут в trip.js</footer>

<script src="trip.js"></script>
<script>
  // ── Icon set (used only for small section-head glyphs now) ───────
  const ICONS = {
    hotel: '<path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-7h6v7"/>',
    note: '<path d="M6 3h9l3 3v15H6z"/><path d="M15 3v3h3M9 11h6M9 15h6"/>',
  };
  function iconSvg(type, size = 18) {
    const body = ICONS[type] || '<circle cx="12" cy="12" r="3"/>';
    return `<svg class="icon" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
  }

  // ── Header text ──────────────────────────────────────────────────
  document.getElementById("hero-place").textContent = TRIP.place || "";
  document.getElementById("hero-title").textContent = TRIP.title || "";
  document.getElementById("hero-subtitle").textContent = TRIP.subtitle || "";
  document.getElementById("hero-tagline").textContent = TRIP.tagline || "";
  document.getElementById("hero-dates").textContent = TRIP.dates || "";
  document.getElementById("hero-motto").textContent = TRIP.motto || "";
  document.getElementById("hero-disclaimer").textContent = TRIP.disclaimer || "";

  // ── Trip status (countdown / live / done) ───────────────────────
  const now = new Date();
  const days = TRIP.days.filter((d) => d.iso);
  const dayDates = days.map((d) => new Date(d.iso + "T00:00:00"));
  const tripStart = dayDates[0];
  const tripEnd = dayDates.length ? new Date(dayDates[dayDates.length - 1].getTime() + 24 * 3600 * 1000) : null;

  function daysBetween(a, b) { return Math.ceil((b - a) / (24 * 3600 * 1000)); }
  function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  const statusRoot = document.getElementById("status-root");
  let todayIso = null;

  if (tripStart && now < tripStart) {
    const n = daysBetween(now, tripStart);
    statusRoot.innerHTML = `<div class="status-badge">До поездки: ${n} ${plural(n, "день", "дня", "дней")}</div>`;
  } else if (tripEnd && now >= tripStart && now < tripEnd) {
    todayIso = now.toISOString().slice(0, 10);
    const idx = days.findIndex((d) => d.iso === todayIso);
    statusRoot.innerHTML = `<div class="status-badge live"><span class="pulse"></span> Поездка идёт — день ${idx >= 0 ? idx + 1 : "?"} из ${days.length}</div>`;
  } else if (tripEnd) {
    statusRoot.innerHTML = `<div class="status-badge done">Поездка завершена — Näkemiin, Karjala!</div>`;
  }

  const progRoot = document.getElementById("trip-progress");
  days.forEach((d) => {
    const seg = document.createElement("div");
    seg.className = "seg" + (d.iso === todayIso ? " today" : "");
    const dDate = new Date(d.iso + "T00:00:00");
    const dEnd = new Date(dDate.getTime() + 24 * 3600 * 1000);
    let fill = 0;
    if (now >= dEnd) fill = 100;
    else if (now >= dDate && now < dEnd) fill = Math.round(((now - dDate) / (dEnd - dDate)) * 100);
    seg.innerHTML = `<i style="width:${fill}%"></i>`;
    progRoot.appendChild(seg);
  });

  // ── Day spreads ──────────────────────────────────────────────────
  const dayNav = document.getElementById("day-nav");
  const daysRoot = document.getElementById("days-root");

  TRIP.days.forEach((day, i) => {
    const id = `day-${i + 1}`;
    const isToday = day.iso === todayIso;

    const link = document.createElement("a");
    link.href = `#${id}`;
    link.textContent = `День ${i + 1}`;
    link.dataset.target = id;
    if (isToday) link.classList.add("today");
    dayNav.appendChild(link);

    const section = document.createElement("section");
    section.className = "day-spread";
    section.id = id;

    const img = day.image || {};
    section.innerHTML = `
      <div class="bg"><img src="${img.src || ""}" alt="${img.alt || ""}" loading="lazy"></div>
      <div class="scrim"></div>
      <div class="num${isToday ? " today" : ""}">${String(i + 1).padStart(2, "0")} / ${String(TRIP.days.length).padStart(2, "0")}</div>
      ${img.caption ? `<div class="credit">${img.caption}</div>` : ""}
      <div class="wrap"><div class="day-panel"><div class="t-list"></div></div></div>
      <div class="ornament-footer"></div>
    `;

    const contentCol = section.querySelector(".day-panel");
    const list = section.querySelector(".t-list");
    if (isToday) contentCol.classList.add("today");
    contentCol.insertAdjacentHTML("afterbegin", `
      <div class="kicker">День ${i + 1}</div>
      <h2>${day.title}</h2>
      <div class="date">${day.date}</div>
    `);

    day.events.forEach((ev) => {
      let cls = "t-item";
      if (isToday) {
        const t = ev.time.match(/(\d{1,2}):(\d{2})/);
        if (t) {
          const evMinutes = parseInt(t[1], 10) * 60 + parseInt(t[2], 10);
          const nowMinutes = now.getHours() * 60 + now.getMinutes();
          if (evMinutes < nowMinutes - 30) cls += " past";
          else if (evMinutes <= nowMinutes + 30) cls += " now";
        }
      }
      const item = document.createElement("div");
      item.className = cls;
      item.innerHTML = `
        <div class="time">${ev.time}</div>
        <div class="body">
          <div class="title">${ev.title}</div>
          ${ev.meta ? `<div class="meta">${ev.meta}</div>` : ""}
        </div>
      `;
      list.appendChild(item);
    });

    daysRoot.appendChild(section);
  });

  // ── Lodging ──────────────────────────────────────────────────────
  if (TRIP.lodging) {
    const root = document.getElementById("lodging-root");
    const grid = TRIP.lodging.houses
      .map((h) => `
      <div class="house-card">
        ${h.image ? `<div class="photo"><img src="${h.image.src}" alt="${h.image.alt || ""}" loading="lazy"></div>` : ""}
        <div class="body">
          <h3>${h.name}</h3>
          <div class="people">${h.people}</div>
          <p class="note">${h.note || ""}</p>
        </div>
      </div>`)
      .join("");
    root.innerHTML = `
      <div class="section-head">${iconSvg("hotel", 22)}<h2>${TRIP.lodging.title}</h2></div>
      <p class="note">${TRIP.lodging.note || ""}</p>
      <div class="house-grid">${grid}</div>
    `;
  }

  // ── Glossary ─────────────────────────────────────────────────────
  if (TRIP.glossary) {
    const root = document.getElementById("glossary-root");
    const rows = TRIP.glossary.words
      .map((w) => `<div class="term-row"><span class="term">${w.term}</span><span class="def">${w.def}</span></div>`)
      .join("");
    root.innerHTML = `
      <div class="section-head">${iconSvg("note", 22)}<h2>${TRIP.glossary.title}</h2></div>
      <div class="glossary-grid">${rows}</div>
    `;
  }

  // ── Active day highlight on scroll ───────────────────────────────
  const links = [...dayNav.querySelectorAll("a")];
  const sections = [...daysRoot.querySelectorAll("section.day-spread")];
  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          links.forEach((l) => l.classList.toggle("active", l.dataset.target === entry.target.id));
        }
      });
    },
    { rootMargin: "-20% 0px -60% 0px" }
  );
  sections.forEach((s) => observer.observe(s));
  if (links[0]) links[0].classList.add("active");
</script>

</body>
</html>
